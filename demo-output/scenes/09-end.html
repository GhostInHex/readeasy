<!doctype html>
<!-- ReadEasy demo — 09 · end card -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fbf6ec; --ink: #231e19; --ink-soft: #5c5348; --accent: #22406a; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", sans-serif;
    display: grid; place-items: center; text-align: center;
  }
  .wordmark { font-family: "Literata", serif; font-weight: 700; font-size: 150px; letter-spacing: -0.02em; line-height: 1; }
  .wordmark em { font-style: normal; color: var(--accent); }
  .tagline { margin-top: 40px; font-size: 46px; color: var(--ink-soft); }
  .cta {
    display: inline-block; margin-top: 76px; padding: 26px 58px;
    background: var(--accent); color: #fffcf5; border-radius: 999px;
    font-size: 38px; font-weight: 700; text-decoration: none;
    box-shadow: 0 18px 40px rgba(34,64,106,0.28);
  }
  .tech { margin-top: 56px; font-size: 28px; color: var(--ink-soft); }
</style>
</head>
<body>
  <div>
    <h1 class="wordmark">Read<em>Easy</em></h1>
    <p class="tagline">The web, made readable for every reader.</p>
    <a class="cta">github.com/GhostInHex/readeasy</a>
    <p class="tech">Next.js · OpenRouter · the browser’s own voice — no database, no account, your data stays on your device.</p>
  </div>
</body>
</html>
